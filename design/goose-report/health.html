@media (prefers-color-scheme: light) {
:root {
  
  --ps-desk: #E6DDCD;
  --ps-panel: #FFFCF6;
  --ps-panel-2: #F1E9DB;
  --ps-edge: #2A2233;
  --ps-bubble: #2A2233;
  --ps-shelf: #C9B48E;
  --ps-shelf-top: #E2D2B0;
  
  --ps-text: #2A2233;
  --ps-muted: #645C70;
  --ps-bubble-text: #FFFCF6;
  --ps-on-st: #FFFFFF;
  --ps-accent: #8A5A00;
  
  --st-idle: #3D6E8C;
  --st-thinking: #6A48C8;
  --st-working: #0B7391;
  --st-waiting: #A85B00;
  --st-success: #1F7A3D;
  --st-error: #C22F2F;
  --st-stuck: #5A6477;
  
  --tk-todo: #2A2233;
  --tk-active: #8A5A00;
  --tk-review: #2F5FD0;
  --tk-blocked: #B0237E;
  --tk-parked: #645C70;
  --tk-done: #645C70;
  
  --fl-ducks: #E3BC2C;
  --fl-question-time: #2FA873;
  --fl-ticket: #E0609A;
  --fl-shoot: #E0502F;
  --fl-handoff: #3F74E0;
  --fl-coderot: #8A5FD6;
  
  --em-startled: #FFB23E;
  --em-water: #7FE6FF;
  --em-sparkle: #F7D64A;
  --em-dream: #C7B2FF;
  --em-worry: #A9B3C6;
  --ps-line: rgba(42,34,51,.16); --ps-hard: rgba(60,40,10,.28);
}
}
:root {
  
  --fl-unpack: #3FD0D8;
  --fl-walk: #B6E04A;
  --fl-reel: #F2A65E;
  
  --lim-warn: var(--st-waiting);
  --lim-out: var(--st-error);
  --bar-amber: var(--st-waiting);
  --bar-red: var(--st-error);
  
  --cl-dim: .5;
  --cl-flag: var(--ps-accent);
  
  --arc-star: var(--ps-accent);
  
  --fl-sneak: #E060EC;
  --fl-scrub: #BFE6F7;
  --fl-bigpeep: #5560D8;
  --fl-tweet: #DC4667;
  --fl-goose: #A47552;
  --em-tweet: var(--em-dream);
  --gr-edge: var(--ps-edge);
  --gr-edge-hot: var(--ps-accent);
  --gr-file: var(--ps-edge);
  --gr-file-hot: var(--ps-accent);
}
@media (prefers-color-scheme: light) {
:root {
  --fl-unpack: #13959E;
  --fl-walk: #76A01A;
  --fl-reel: #B8702E;
  --cl-dim: .55;
  --fl-sneak: #A82EB5;
  --fl-scrub: #7CC2E8;
  --fl-bigpeep: #2A2E8C;
  --fl-tweet: #AE2348;
  --fl-goose: #6F4728;
}
}
:root {
  --go-paper: var(--ps-panel);
  --go-find: var(--st-waiting);
  --go-clear: var(--st-success);
  --go-link: var(--tk-review);
}

html { background: var(--ps-desk); }
body { margin: 0; }
.go { min-height: 100vh; }

/* Goose report: one frame, three reports (map, health, topic). Tokens only, so it runs under :root (standalone pages)
   and under the artboards' .th-dark / .th-light. Responsive rules are container queries on .go, not the viewport. */
.go { container-type: inline-size; background: var(--ps-desk); color: var(--ps-text); font: 13px/1.45 'IBM Plex Mono', monospace; padding: clamp(8px, 2cqw, 24px); }
.go * { box-sizing: border-box; }
.go a { color: var(--go-link); }
.go :focus-visible { outline: 2px solid var(--ps-accent); outline-offset: 2px; }
.st-idle { --st: var(--st-idle); } .st-thinking { --st: var(--st-thinking); } .st-working { --st: var(--st-working); }
.st-waiting { --st: var(--st-waiting); } .st-success { --st: var(--st-success); } .st-error { --st: var(--st-error); } .st-stuck { --st: var(--st-stuck); }

/* frame */
.go-win { max-width: 1232px; margin: 0 auto; background: var(--go-paper); border: 2px solid var(--ps-edge); box-shadow: 6px 6px 0 var(--ps-hard); }
.go-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 34px; padding: 5px 10px; border-bottom: 2px solid var(--ps-edge); background: repeating-linear-gradient(0deg, transparent 0 3px, var(--ps-line) 3px 4px); }
.go-title { display: inline-flex; align-items: center; gap: 6px; margin-right: auto; font: 600 13px 'IBM Plex Mono', monospace; color: var(--ps-accent); background: var(--go-paper); padding: 2px 6px; text-transform: uppercase; letter-spacing: .04em; }
.go-sub { font: 500 11px 'IBM Plex Mono', monospace; color: var(--ps-muted); background: var(--go-paper); padding: 2px 6px; white-space: nowrap; }
.go-sub b { color: var(--ps-text); font-weight: 600; }
.go-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 2px solid var(--ps-edge); }
.go-tabs a { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 4px 6px; border-top: 4px solid transparent; background: var(--ps-panel-2); color: var(--ps-muted); font: 600 12px 'IBM Plex Mono', monospace; text-align: center; text-decoration: none; }
.go-tabs a + a { border-left: 2px solid var(--ps-edge); }
.go-tabs a:hover { color: var(--ps-text); }
.go-tabs a[aria-current] { background: var(--go-paper); color: var(--ps-text); border-top-color: var(--ps-accent); }
.go-tabs a:focus-visible { outline-offset: -4px; }
.go-main { display: flex; flex-direction: column; gap: 16px; padding: clamp(10px, 2cqw, 20px); }
.go-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 6px 10px; border-top: 2px solid var(--ps-edge); font-size: 11px; color: var(--ps-muted); }
.go-foot span { display: inline-flex; align-items: center; gap: 6px; }
.go-foot .ln { width: 18px; height: 2px; background: var(--gr-edge); position: relative; }
.go-foot .ln::after { content: ""; position: absolute; right: 0; top: -2px; width: 6px; height: 6px; background: var(--gr-edge); }
.go-foot .sq { width: 4px; height: 4px; background: var(--gr-file); } .go-foot .sq.on { background: var(--gr-file-hot); }
.go-h { margin: 0; font: 600 11px 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ps-muted); }

/* lead: house peep on a plank, with the report's one line */
.go-lead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.go-perch { flex: none; display: flex; flex-direction: column; align-items: center; width: 64px; }
.go-plank { display: block; width: 100%; height: 6px; background: repeating-linear-gradient(90deg, var(--ps-shelf) 0 8px, var(--ps-shelf-top) 8px 16px); }
.go-bub { position: relative; flex: 1 1 220px; min-width: 0; margin-bottom: 10px; padding: 8px 10px; background: var(--ps-bubble); color: var(--ps-bubble-text); font: 14px/1.4 'IBM Plex Sans', system-ui, sans-serif; }
.go-bub::before { content: ""; position: absolute; left: -6px; bottom: 6px; width: 4px; height: 4px; background: var(--ps-bubble); box-shadow: -2px 2px 0 var(--ps-bubble); }
.go-bub b { font-weight: 600; }

/* code map */
.go-mapwrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.go-mapbox { flex: 999 1 520px; min-width: 0; overflow-x: auto; border: 2px solid var(--ps-edge); background: var(--ps-desk) repeating-linear-gradient(0deg, transparent 0 15px, var(--ps-line) 15px 16px); }
.go-map { position: relative; }
.go-side { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.gnode { position: absolute; width: 120px; z-index: 2; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
.gstand { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 32px; }
.gplank { display: block; height: 6px; background: repeating-linear-gradient(90deg, var(--ps-shelf) 0 8px, var(--ps-shelf-top) 8px 16px); }
.gcard { display: flex; flex-direction: column; gap: 5px; height: 40px; padding: 5px 6px; background: var(--go-paper); border: 2px solid var(--ps-edge); border-top: 0; }
.gn { display: flex; justify-content: space-between; gap: 6px; font: 600 12px/14px 'IBM Plex Mono', monospace; white-space: nowrap; }
.gn span { font-weight: 400; font-size: 10px; color: var(--ps-muted); }
.gfiles { display: flex; gap: 2px; height: 4px; overflow: hidden; }
.gfiles i { flex: none; width: 4px; height: 4px; background: var(--gr-file); }
.gfiles i.on { background: var(--gr-file-hot); }

<script>// Goose report renderer: one template, three kinds (map, health, topic). Reads the JSON in #report.

  const D = JSON.parse(document.getElementById('report').textContent);
  const KINDS = { map: ['Code map', 'map.html'], health: ['Repo health', 'health.html'], topic: ['Custom topic', 'topic.html'] };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const code = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  const peep = (p, size) => `<peep-bot state="${p.state}" color="${p.color}" accessory="${p.acc}" size="${size}"></peep-bot>`;
  const needs = (id, edges) => edges.filter((e) => e[0] === id).map((e) => e[1]);
  const usedBy = (id, edges) => edges.filter((e) => e[1] === id).map((e) => e[0]);

  function area(a, sessions, tag, style) {
    const here = sessions.filter((p) => p.area === a.id);
    const blocks = Array.from({ length: Math.min(16, Math.ceil(a.files / 3)) }, (_, i) => `<i${i < (a.editing || 0) ? ' class="on"' : ''}></i>`).join('');
    const label = `${a.id}, ${a.files} files` + (here.length ? `, ${here.length} session${here.length > 1 ? 's' : ''} editing` : '');
    return `<${tag} class="gnode${here.some((p) => p.state === 'waiting') ? ' att' : ''}" data-id="${esc(a.id)}"${style ? ` style="${style}"` : ''}${tag === 'button' ? ` aria-label="${esc(label)}"` : ''}>
      <div class="gstand">${here.slice(0, 2).map((p) => peep(p, 32)).join('')}</div><span class="gplank"></span>

    const at = {};

    edges.forEach(([a, b]) => {
      const A = at[a], B = at[b], x1 = A.x + 120, y1 = A.y + 57, y2 = B.y + 57, mx = x1 + 12 + A.r * 12;
      [[x1, y1, mx - x1 + 2, 2], [mx, Math.min(y1, y2), 2, Math.abs(y2 - y1) + 2], [mx, y2, B.x - mx, 2], [B.x - 6, y2 - 2, 6, 6]].forEach(([x, y, w, h]) => {
        html += `<span class="gedge" data-a="${esc(a)}" data-b="${esc(b)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></span>`;
      });

    const w = 2 * pad + Math.max(...areas.map((a) => a.col)) * pitch + 120, h = 2 * pad + Math.max(...areas.map((a) => a.row)) * rowPitch + 78;

  }

  const body = { map, health, topic }[D.kind]();
  const legend = D.kind === 'map' ? '<span class="wide"><i class="ln"></i>needs, ends at the area needed</span><span><i class="sq"></i>3 files</span><span><i class="sq on"></i>being edited</span>' : '';
  document.getElementById('go').innerHTML = `<div class="go-win">
    <header class="go-head"><span class="go-title"><span class="fl"></span>Goose · ${KINDS[D.kind][0]}</span><span class="go-sub"><b>${esc(D.repo)}</b></span><span class="go-sub">${esc(D.date)}</span><span class="go-sub">${esc(D.commit)}</span></header>
    <nav class="go-tabs" aria-label="Reports">${Object.entries(KINDS).map(([k, [name, href]]) => `<a href="${href}"${k === D.kind ? ' aria-current="page"' : ''}>${name}</a>`).join('')}</nav>
    <main class="go-main">${D.lead ? `<div class="go-lead"><span class="go-perch">${peep({ state: D.peep || 'idle', color: 'yellow', acc: 'none' }, 48)}<span class="go-plank"></span></span><div class="go-bub">${esc(D.lead)}</div></div>` : ''}${body}</main>
    <footer class="go-foot">${legend}${D.foot.map((t) => `<span>${esc(t)}</span>`).join('')}<span>made by /peep:goose</span></footer></div>`;

  // Hover or focus an area: its links and neighbours stay lit, the rest dim.
  const m = document.getElementById('map');
  if (m) {
    const mark = (id) => {
      const near = id ? new Set([id, ...needs(id, D.edges), ...usedBy(id, D.edges)]) : null;
      m.querySelectorAll('.gnode').forEach((n) => { n.classList.toggle('dim', !!near && !near.has(n.dataset.id)); n.classList.toggle('hot', n.dataset.id === id); });
      m.querySelectorAll('.gedge').forEach((s) => { const on = s.dataset.a === id || s.dataset.b === id; s.classList.toggle('hot', on); s.classList.toggle('dim', !!id && !on); });
    };
    m.querySelectorAll('.gnode').forEach((n) => { n.onmouseenter = n.onfocus = () => mark(n.dataset.id); n.onmouseleave = n.onblur = () => mark(null); });
  }
})();
</script>
</body>
</html>

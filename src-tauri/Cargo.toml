[package]
name = "peep-this"
version = "0.1.0"
description = "Desktop widget showing live Claude Code sessions"
edition = "2024"
default-run = "peep-this"

[lib]
# `_lib` suffix avoids a bin/lib name clash on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "peep_this_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

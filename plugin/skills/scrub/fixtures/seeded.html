<!doctype html>
<html>
<head>
<style>
body { font-family: "Inter", sans-serif; }
.hero { background: linear-gradient(135deg, indigo 0%, purple 100%); }
.hero h1 { -webkit-background-clip: text; color: transparent; }
.label { text-transform: uppercase; letter-spacing: 0.12em; }
.card { backdrop-filter: blur(12px); }
</style>
</head>
<body>
<section class="hero">
  <p class="label">New</p>
  <h1>Ship faster</h1>
  <div class="card">Everything you need.</div>
</section>
</body>
</html>
